name: Deploy GodCares365

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_USER="${{ secrets.VPS_USER }}"

          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "ERROR: VPS_HOST or VPS_USER secret is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode base64 SSH private key (handles CR/LF/space noise)
          KEY_B64_CLEAN="$(printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | tr -d '\n\r ')"
          if [ -z "$KEY_B64_CLEAN" ]; then
            echo "ERROR: VPS_SSH_KEY_B64 secret is empty."
            exit 1
          fi
          printf '%s' "$KEY_B64_CLEAN" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ ! -s ~/.ssh/id_ed25519 ]; then
            echo "ERROR: Decoded SSH key file is empty."
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "ERROR: Decoded SSH key is invalid."
            exit 1
          fi

          # Add host key to known_hosts with retry (avoid random network flake)
          SSH_SCAN_OK=0
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
              SSH_SCAN_OK=1
              break
            fi
            sleep 2
          done
          if [ "$SSH_SCAN_OK" -ne 1 ]; then
            echo "ERROR: ssh-keyscan failed for host: $VPS_HOST"
            cat /tmp/ssh-keyscan.err || true
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: SSH smoke test
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "whoami && hostname"

      - name: Package build (dist)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "ERROR: dist directory not found after build."
            pwd
            ls -la
            exit 1
          fi
          if [ ! -f deploy/nginx/spa.conf ]; then
            echo "ERROR: deploy/nginx/spa.conf not found."
            pwd
            ls -la deploy || true
            ls -la deploy/nginx || true
            exit 1
          fi
          tar -C dist -czf dist.tar.gz .
          ls -lh dist.tar.gz

      - name: Upload build + Nginx config to VPS
        shell: bash
        run: |
          set -euo pipefail

          # Upload build tarball + nginx config to /tmp
          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            dist.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/dist.tar.gz"
          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            deploy/nginx/spa.conf \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/godcares365-spa.conf"

          # Extract into web root + install nginx site config
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -euo pipefail
             WEB_ROOT="/var/www/godcares365"
             TMP_DEPLOY_DIR="$WEB_ROOT/.deploy_tmp"
             NGINX_SOURCE="/tmp/godcares365-spa.conf"
             NGINX_SITE="/etc/nginx/sites-available/godcares365.conf"
             NGINX_SITE_ENABLED="/etc/nginx/sites-enabled/godcares365.conf"
             LEGACY_NGINX_SITE_ENABLED="/etc/nginx/sites-enabled/godcares365.com"
             LEGACY_NGINX_CONF_D="/etc/nginx/conf.d/godcares365.conf"
             NGINX_CONF_D="/etc/nginx/conf.d/godcares365.conf"
             run_privileged() {
               if [ "$(id -u)" -eq 0 ]; then
                 "$@"
               elif command -v sudo >/dev/null 2>&1; then
                 sudo -n "$@"
               else
                 "$@"
               fi
             }

             mkdir -p "$WEB_ROOT"

             # extract to temp folder first
             rm -rf "$TMP_DEPLOY_DIR"
             mkdir -p "$TMP_DEPLOY_DIR"
             tar -xzf /tmp/dist.tar.gz -C "$TMP_DEPLOY_DIR"
             rm -f /tmp/dist.tar.gz

             # replace contents
             rm -rf "$WEB_ROOT"/*
             shopt -s dotglob
             mv "$TMP_DEPLOY_DIR"/* "$WEB_ROOT/"
             rm -rf "$TMP_DEPLOY_DIR"

             # install and enable nginx site config
             test -f "$NGINX_SOURCE"
             NGINX_DUMP="$(run_privileged nginx -T 2>/dev/null || true)"
             if echo "$NGINX_DUMP" | grep -qE "include\\s+/etc/nginx/sites-enabled/\\*"; then
               run_privileged mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
               run_privileged cp "$NGINX_SOURCE" "$NGINX_SITE"
               run_privileged ln -sfn "$NGINX_SITE" "$NGINX_SITE_ENABLED"
             elif echo "$NGINX_DUMP" | grep -qE "include\\s+/etc/nginx/conf\\.d/\\*\\.conf"; then
               run_privileged mkdir -p /etc/nginx/conf.d
               run_privileged cp "$NGINX_SOURCE" "$NGINX_CONF_D"
             else
               # fallback to common Debian/Ubuntu layout
               run_privileged mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
               run_privileged cp "$NGINX_SOURCE" "$NGINX_SITE"
               run_privileged ln -sfn "$NGINX_SITE" "$NGINX_SITE_ENABLED"
             fi

             # disable default site if present to avoid refresh 404 from wrong vhost
             if [ -e /etc/nginx/sites-enabled/default ]; then
               run_privileged rm -f /etc/nginx/sites-enabled/default
             fi
             # disable known legacy duplicate vhost
             if [ -e "$LEGACY_NGINX_SITE_ENABLED" ]; then
               run_privileged rm -f "$LEGACY_NGINX_SITE_ENABLED"
             fi
             # if using sites-enabled layout, remove duplicate conf.d copy
             if [ -e "$NGINX_SITE_ENABLED" ] && [ -e "$LEGACY_NGINX_CONF_D" ]; then
               run_privileged rm -f "$LEGACY_NGINX_CONF_D"
             fi
             rm -f "$NGINX_SOURCE"

             run_privileged nginx -t
             run_privileged systemctl reload nginx

              # hard check: active config should contain a try_files fallback to /index.html
              if ! run_privileged nginx -T 2>/dev/null | grep -qE "try_files[[:space:]].*/index\\.html;"; then
                echo "ERROR: Active Nginx config has no SPA fallback to /index.html."
                exit 1
              fi

              # hard check: media handler must be protected from regex override (use ^~ /media/)
              if ! run_privileged nginx -T 2>/dev/null | grep -qE "location[[:space:]]+\\^~[[:space:]]+/media/"; then
                echo "ERROR: Active Nginx config has no '^~ /media/' block. Media may return 404."
                exit 1
              fi

              # runtime check: client-side route refresh should not return 404
              if command -v curl >/dev/null 2>&1; then
                SPA_STATUS="$(curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1/about -H "Host: godcares365.com")"
                if [ "$SPA_STATUS" -ge 400 ]; then
                  echo "ERROR: SPA route /about returned HTTP $SPA_STATUS"
                  exit 1
                fi

                # runtime check: nginx must proxy API to backend (detect bad upstream/port quickly)
                API_STATUS="$(curl -k -s -o /dev/null -w "%{http_code}" "https://127.0.0.1/api/blog/?client_id=deploy-smoke" -H "Host: godcares365.com")"
                if ! echo "$API_STATUS" | grep -Eq "^[0-9]{3}$"; then
                  echo "ERROR: API reverse proxy /api/blog returned non-http code: ${API_STATUS:-unknown}"
                  exit 1
                fi
                if [ "$API_STATUS" -ge 500 ]; then
                  echo "ERROR: API reverse proxy /api/blog returned HTTP ${API_STATUS:-unknown}"
                  exit 1
                fi
              else
                echo "WARN: curl not found on server; skipping runtime SPA HTTP check."
              fi
             '
