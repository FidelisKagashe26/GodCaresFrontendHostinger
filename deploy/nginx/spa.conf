# God Cares 365 - React SPA + API (Nginx)
# Replace cert paths + backend upstream as needed.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name godcares365.com www.godcares365.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name godcares365.com www.godcares365.com;

    ssl_certificate /etc/letsencrypt/live/godcares365.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/godcares365.com/privkey.pem;

    # React build output (Vite dist)
    root /var/www/godcares365;
    index index.html;

    # Static frontend assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional public static files in dist root (favicon, manifest, etc.)
    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API (Django/Gunicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend media
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (critical for refresh on /blog, /about, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
