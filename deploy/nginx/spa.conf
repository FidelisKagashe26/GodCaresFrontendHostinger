# God Cares 365 - React SPA + API (Nginx)
# Domain is proxied through Cloudflare; TLS between Cloudflare and this origin
# uses a Cloudflare Origin CA certificate (long-lived, not managed by certbot).
# Cert/key live only on the server at /etc/ssl/cloudflare/ (not in this repo).

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name godcares365.com www.godcares365.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name godcares365.com www.godcares365.com;

    ssl_certificate /etc/ssl/cloudflare/godcares365.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/godcares365.com.key;

    # Admin panel uploads several full-size photos in one POST (e.g. the hero
    # section). Nginx's 1M default rejected those before Django ever saw them
    # ("client intended to send too large body"), so the upload appeared to hang.
    client_max_body_size 64M;
    client_body_timeout 300s;

    # React build output (Vite dist)
    root /var/www/godcares365;
    index index.html;

    # Static frontend assets
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional public static files in dist root (favicon, manifest, etc.)
    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API (Django/Gunicorn on 127.0.0.1:8001)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image compression on multi-photo admin saves can exceed the 60s default.
        # Request buffering is deliberately left ON (nginx default): with only 3
        # sync gunicorn workers, buffering lets nginx absorb a slow mobile upload
        # so a worker is tied up only for the actual processing, not the transfer.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Media files stored by backend.
    # NOTE: this must be ^~ so the generic extension regex below cannot override it.
    location ^~ /media/ {
        alias /var/www/godcares365_backend/media/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback (critical for refresh on /blog, /about, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
