# God Cares 365 - React SPA + API (Nginx)
# Place this in your Nginx site config and adjust paths/domains as needed.

server {
    listen 80;
    server_name godcares365.com www.godcares365.com;

    # React build output (Vite dist)
    root /var/www/godcares365/frontend/dist;
    index index.html;

    # Static frontend assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional public static files in dist root (favicon, manifest, etc.)
    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API (Django/Gunicorn example)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend media (if served by Django app)
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback:
    # important line that prevents 404 on page refresh for /about-us, /blog, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
