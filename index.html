        background: var(--surface-2);
        border-bottom: 1px solid var(--border-subtle);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow-soft);
      }
      .gc-icon-button {
        background: var(--surface-3);
        border: 1px solid var(--border-subtle);
        color: var(--text-primary);
        box-shadow: var(--shadow-soft);

      }

        background: var(--surface-1);
        transform: translateY(-1px);
      }
      .gc-icon-button:active {
        transform: translateY(0);
      }
      .gc-icon-button.is-active {
        background: var(--accent-soft);
        border-color: rgba(238, 183, 32, 0.55);
        color: var(--accent-ink);
      }
      .dark .gc-icon-button.is-active {
        color: var(--text-primary);
      }
      .gc-button-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: var(--accent-ink);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: var(--shadow-soft);
        transition: transform 200ms ease, filter 200ms ease, box-shadow 200ms ease;
      }
      .gc-button-primary:hover {
        transform: translateY(-1px);
        filter: brightness(0.98);
        box-shadow: var(--shadow-lift);

        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text-primary);
        transition: transform 200ms ease, border-color 200ms ease, background 200ms ease, color 200ms ease;

        stroke: var(--border-subtle);
